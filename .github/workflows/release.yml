# Publishes cryptolite to npm with provenance on every push to main.
#
# Standard nivkman/EnterGreat release: run the full CI checks, then auto patch-bump the version,
# commit + tag it back to main ([skip ci] so it doesn't loop), and publish. Requires the NPM_TOKEN
# repository secret (an npm automation/granular token with publish rights for cryptolite).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    # Same checks as every push: Node 20/22/24, typecheck, build, test, lint:pkg.
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the version bump commit and tag
      id-token: write # npm provenance (signed build attestation)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Bump patch version
        run: |
          git config user.name  "eg-ci[bot]"
          git config user.email "ci@entergreat.com"
          npm version patch -m "ci: release %s [skip ci]"
          git push --follow-tags origin HEAD:main

      - run: npm run build

      # prepack (scripts/verify-dist.mjs) refuses to publish a missing, partial or stale build.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
